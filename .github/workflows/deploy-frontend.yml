# Deploys the Nuxt frontend (frontend/) to Vercel production. Rationale,
# required secrets and the Git-integration switch-off: see
# ../../docs/DEPLOYMENT.md (section "Frontend (Nuxt)").
#
# The Vercel project's own Git auto-deploy is turned off for `master` by
# frontend/vercel.json (`git.deploymentEnabled`), otherwise every push would
# be deployed twice -- once by Vercel, once here. Other branches still get
# Vercel's normal preview deployments.
#
# Same three-step flow as Vercel's own "GitHub Actions" guide: pull the
# project settings/env vars, build locally on the runner, upload the
# prebuilt output. The Vercel project's Root Directory is `frontend`, so the
# CLI runs from the repo root (running it from frontend/ would look for
# frontend/frontend).

name: Deploy chat-ia (frontend)

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Queues overlapping runs instead of cancelling one mid-upload.
concurrency:
  group: deploy-frontend

env:
  # The CLI reads all three from the environment: the token to authenticate,
  # the two IDs to link to the project (no `vercel link` needed). The IDs
  # aren't sensitive but are kept as secrets next to the token.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production Frontend
      url: https://ia.maxime.bzh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Matches the Node version set on the Vercel project (24.x) -- the
      # build below runs on this runner, not on Vercel's.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      # TEMPORARY: the first run failed at `vercel pull` with "Could not
      # retrieve Project Settings". Prints only non-sensitive facts (lengths,
      # the account the token belongs to, the teams it can see) to tell a
      # mistyped ID from a token without access to the team. Remove once fixed.
      - name: Diagnose Vercel credentials
        continue-on-error: true
        run: |
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID} (expected 29)"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID} (expected 32)"
          echo "starts with: ${VERCEL_ORG_ID:0:5} / ${VERCEL_PROJECT_ID:0:4}"
          echo "--- token account:"; vercel whoami
          echo "--- teams the token can see:"; vercel teams ls

      - name: Pull Vercel project settings and environment variables
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod
