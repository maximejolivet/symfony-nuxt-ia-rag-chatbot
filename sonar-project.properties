# SonarCloud project configuration. Read by the "SonarCloud" workflow.
# Project key follows SonarCloud's default "<org>_<repo>" format; confirm it
# matches the project created in sonarcloud.io.
sonar.projectKey=maximejolivet_symfony-nuxt-ia-rag-chatbot
sonar.organization=maximejolivet
sonar.projectName=chatbot-ia

sonar.sources=backend/src,frontend
sonar.tests=backend/tests,frontend
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,backend/tests/**/*.php

# Generated code, dependencies and build output: not worth scanning.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,backend/var/**,backend/public/build/**,backend/public/bundles/**

sonar.sourceEncoding=UTF-8
